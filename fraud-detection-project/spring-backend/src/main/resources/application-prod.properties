# Production profile (activate with SPRING_PROFILES_ACTIVE=prod)

# Server
server.port=${PORT:8080}

# MySQL datasource (use environment variables in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/frauddb?useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA - for production prefer `validate` and manage schema with migrations
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hikari pool tuning
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:30000}

# Disable H2 console in production
spring.h2.console.enabled=false

# ML service base URL (set ML_SERVICE_URL in prod environment)
app.ml.base-url=${ML_SERVICE_URL:http://ml-service:8000}

# Management/Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Logging
logging.level.org.hibernate.SQL=warn
