spring.application.name=demo
# Use the PORT provided by the hosting environment (Render) when available
server.port=${PORT:8080}

# ML Service base URL - set this in Render as the env var `ML_SERVICE_URL`
app.ml.base-url=${ML_SERVICE_URL:http://localhost:8000}

# RestTemplate timeout (ms)
app.ml.connect-timeout=5000
app.ml.read-timeout=15000
spring.jackson.property-naming-strategy=SNAKE_CASE

# Datasource configuration - use environment variables in production.
# Do NOT commit production credentials into source control. Set the following
# private environment variables in Render: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/safenet_fraud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pass@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Expose actuator health/info endpoints (ensure spring-boot-starter-actuator is added to pom.xml)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
