spring.application.name=demo
# Use the PORT provided by the hosting environment (Render) when available
server.port=${PORT:8080}

# ML Service base URL - set this in Render as the env var `ML_SERVICE_URL`
app.ml.base-url=${ML_SERVICE_URL:http://localhost:8000}

# RestTemplate timeout (ms)
app.ml.connect-timeout=5000
app.ml.read-timeout=15000
spring.jackson.property-naming-strategy=SNAKE_CASE


# Datasource configuration
# Default to an in-memory H2 database for development / temporary deploys.
# To use a production DB, set the SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Expose actuator health/info endpoints (ensure spring-boot-starter-actuator is added to pom.xml)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Explicit Hibernate dialect compatible with Hibernate 7
# Use MySQL dialect that Hibernate 7 provides; this avoids ClassNotFoundException
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 console (useful for debugging while running with H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
