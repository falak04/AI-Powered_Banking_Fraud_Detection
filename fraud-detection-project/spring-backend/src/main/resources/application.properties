spring.application.name=demo
# Use the PORT provided by the hosting environment (Render) when available
server.port=${PORT:8080}

# ML Service base URL - set this in Render as the env var `ML_SERVICE_URL`
app.ml.base-url=${APP_ML_BASE_URL:https://ai-powered-banking-fraud-detection-nlaq.onrender.com/}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# RestTemplate timeout (ms)
app.ml.connect-timeout=5000
app.ml.read-timeout=15000
spring.jackson.property-naming-strategy=SNAKE_CASE

# Datasource configuration (development defaults to H2 in-memory)
# To use a production DB, set the SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate (dev defaults)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Expose actuator health/info endpoints (ensure spring-boot-starter-actuator is in pom.xml)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# H2 console (enabled for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ML service base URL: prefer environment variable `ML_SERVICE_URL`
# You already set a link here; it's recommended to set ML_SERVICE_URL in production environment
